<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Lady AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 40px; height: 40px; left: 20%; animation-delay: 0.5s; }
        .particle:nth-child(3) { width: 60px; height: 60px; left: 70%; animation-delay: 1s; }
        .particle:nth-child(4) { width: 30px; height: 30px; left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(5) { width: 50px; height: 50px; left: 40%; animation-delay: 2s; }
        .particle:nth-child(6) { width: 35px; height: 35px; left: 60%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideInDown 1s ease-out;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            animation: fadeInScale 1.2s ease-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-fallback {
            width: 150px;
            height: 80px;
            background: linear-gradient(135deg, #333, #000);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            margin: 0 auto 10px;
            animation: fadeInScale 1.2s ease-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .logo-fallback:hover {
            transform: scale(1.05);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90vw;
            max-width: 900px;
            min-width: 320px;
            animation: slideInUp 1s ease-out 0.3s both;
        }

        .form-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #666;
            border-radius: 50px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #333;
            background: white;
            box-shadow: 0 0 20px rgba(51, 51, 51, 0.2);
            transform: translateY(-2px);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #e73c7e, #ee7752);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(231, 60, 126, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(231, 60, 126, 0.4);
            background: linear-gradient(135deg, #ee7752, #e73c7e);
        }

        button:active {
            transform: translateY(-1px);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: "...";
            animation: loading 1s infinite;
        }

        @keyframes loading {
            0%, 33% { content: "..."; }
            34%, 66% { content: "...."; }
            67%, 100% { content: "....."; }
        }

        /* Chat Interface Styles */
        .chat-window {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 0;
            margin-top: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            height: 70vh;
            min-height: 500px;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .ai-status {
            display: flex;
            flex-direction: column;
        }

        .ai-name {
            font-weight: 600;
            font-size: 16px;
        }

        .ai-online {
            font-size: 12px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-indicator {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-height: 200px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeInUp 0.4s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
            line-height: 1.4;
        }

        .message.user .message-bubble {
            background: #f1f5f9;
            color: #334155;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-bottom-left-radius: 5px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
        }

        .message.user .message-avatar {
            background: #f1f5f9;
            color: #64748b;
            order: 2;
            margin-right: 0;
            margin-left: 10px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 14px;
            background: white;
            resize: none;
            min-height: 44px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-container input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-button {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            color: #64748b;
            font-size: 12px;
            font-style: italic;
            margin-bottom: 10px;
        }

        .typing-dots {
            display: flex;
            gap: 2px;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: #64748b;
            border-radius: 50%;
            animation: typing 1.5s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Slide animations */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 10px 5px;
            }
            
            .chat-container {
                width: 98vw;
                margin: 0;
                max-width: none;
                min-width: 280px;
            }

            .chat-window {
                height: 80vh;
                min-height: 400px;
                max-height: 600px;
            }

            .chat-messages {
                padding: 15px;
                min-height: 200px;
            }
            
            h1 {
                font-size: 2rem;
                margin-bottom: 10px;
            }

            .message-bubble {
                max-width: 85%;
                padding: 10px 14px;
            }

            .input-container input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .chat-header {
                padding: 12px 15px;
            }
        }

        /* Large screen optimization */
        @media (min-width: 1200px) {
            .chat-container {
                width: 80vw;
                max-width: 1200px;
            }

            .chat-window {
                height: 65vh;
                min-height: 600px;
            }
        }

        /* Ultra-wide screen optimization */
        @media (min-width: 1600px) {
            .chat-container {
                width: 70vw;
                max-width: 1400px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated particles background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="header">
            <!-- Iron Lady Official Logo -->
            <img src="{{ url_for('static', filename='iron-lady-logo.png') }}" alt="Iron Lady Logo" class="logo">
            <h1>AI Assistant</h1>
            <p class="subtitle">Empowering Women Leaders • Your Gateway to Success</p>
        </div>

        <div class="chat-container">
            <div class="chat-window">
                <div class="chat-header">
                    <div class="ai-avatar">🤖</div>
                    <div class="ai-status">
                        <div class="ai-name">AI Assistant</div>
                        <div class="ai-online">
                            <div class="online-indicator"></div>
                            Online
                        </div>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Welcome message -->
                    <div class="message assistant">
                        <div class="message-avatar">🤖</div>
                        <div class="message-bubble">
                            Welcome to Iron Lady's AI Assistant! I'm here to help you with information about our leadership programs, community, and how we can advance your career. How can I assist you today?
                        </div>
                    </div>
                </div>

                <div class="typing-indicator" id="typingIndicator">
                    <div class="message-avatar">🤖</div>
                    <span>AI Assistant is typing</span>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <form id="chatForm">
                        <div class="input-container">
                            <input type="text" id="messageInput" name="message" placeholder="Type your message here..." required autocomplete="off">
                            <button type="submit" class="send-button" id="submitBtn">
                                <span>➤</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const chatMessages = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');

        // Function to scroll to bottom of chat
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Function to create a message element
        function createMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="message-bubble">${content}</div>
                    <div class="message-avatar">👤</div>
                `;
            } else {
                // Format AI response with proper HTML
                let formattedContent = content
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                
                messageDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-bubble">
                        ${formattedContent}
                    </div>
                `;
            }
            
            return messageDiv;
        }

        // Function to show typing indicator
        function showTyping() {
            typingIndicator.style.display = 'flex';
            scrollToBottom();
        }

        // Function to hide typing indicator
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // Handle form submission
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to chat
            const userMessage = createMessage(message, true);
            chatMessages.appendChild(userMessage);
            scrollToBottom();

            // Clear input and disable form
            messageInput.value = '';
            submitBtn.disabled = true;
            messageInput.disabled = true;
            
            // Show typing indicator
            showTyping();

            try {
                // Send request to chat API endpoint
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `message=${encodeURIComponent(message)}`
                });

                hideTyping();

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success && data.response) {
                        // Add AI response to chat
                        const aiMessage = createMessage(data.response, false);
                        chatMessages.appendChild(aiMessage);
                    } else {
                        // Add error message
                        const errorMessage = createMessage(
                            data.response || 'Sorry, I encountered an error processing your request.', 
                            false
                        );
                        chatMessages.appendChild(errorMessage);
                    }
                } else {
                    // Add network error message
                    const errorMessage = createMessage(
                        'Sorry, I encountered an error. Please try again.', 
                        false
                    );
                    chatMessages.appendChild(errorMessage);
                }
            } catch (error) {
                hideTyping();
                console.error('Error:', error);
                
                // Add network error message
                const errorMessage = createMessage(
                    'Sorry, I encountered a network error. Please try again.', 
                    false
                );
                chatMessages.appendChild(errorMessage);
            } finally {
                // Re-enable form
                submitBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        });

        // Focus on input when page loads
        window.addEventListener('load', function() {
            messageInput.focus();
            scrollToBottom();
        });

        // Handle Enter key in input
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Auto-resize input and visual feedback
        messageInput.addEventListener('input', function() {
            // Visual feedback for send button
            if (this.value.trim()) {
                submitBtn.style.opacity = '1';
            } else {
                submitBtn.style.opacity = '0.7';
            }
        });

        // Initial scroll to bottom
        setTimeout(() => {
            scrollToBottom();
        }, 100);
    </script>
</body>
</html>
