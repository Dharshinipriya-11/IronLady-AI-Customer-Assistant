<!DOCTYPE html>
<html>
<head>
    <title>Iron Lady AI Assistant</title>
</head>
<body>
    <h2>Iron Lady AI Assistant</h2>

    <form method="POST">
        <input type="text" name="message" placeholder="Ask about programs or process" required>
        <button type="submit">Ask</button>
    </form>

    {% if response %}
        <p><strong>Assistant:</strong> {{ response }}</p>
    {% endif %}
</body>
</html>
