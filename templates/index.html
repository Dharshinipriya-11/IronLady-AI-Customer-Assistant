<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Lady AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 40px; height: 40px; left: 20%; animation-delay: 0.5s; }
        .particle:nth-child(3) { width: 60px; height: 60px; left: 70%; animation-delay: 1s; }
        .particle:nth-child(4) { width: 30px; height: 30px; left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(5) { width: 50px; height: 50px; left: 40%; animation-delay: 2s; }
        .particle:nth-child(6) { width: 35px; height: 35px; left: 60%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideInDown 1s ease-out;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            animation: fadeInScale 1.2s ease-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-fallback {
            width: 150px;
            height: 80px;
            background: linear-gradient(135deg, #333, #000);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            margin: 0 auto 10px;
            animation: fadeInScale 1.2s ease-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .logo-fallback:hover {
            transform: scale(1.05);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            animation: slideInUp 1s ease-out 0.3s both;
        }

        .form-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #666;
            border-radius: 50px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #333;
            background: white;
            box-shadow: 0 0 20px rgba(51, 51, 51, 0.2);
            transform: translateY(-2px);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #e73c7e, #ee7752);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(231, 60, 126, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(231, 60, 126, 0.4);
            background: linear-gradient(135deg, #ee7752, #e73c7e);
        }

        button:active {
            transform: translateY(-1px);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: "...";
            animation: loading 1s infinite;
        }

        @keyframes loading {
            0%, 33% { content: "..."; }
            34%, 66% { content: "...."; }
            67%, 100% { content: "....."; }
        }

        .response-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border-left: 5px solid #e73c7e;
            animation: fadeInUp 0.5s ease-out;
            line-height: 1.6;
            white-space: pre-wrap; /* Preserve whitespace and line breaks */
        }

        .response-container strong {
            color: #e73c7e;
            font-size: 1.1rem;
        }

        .response-container p {
            margin: 0;
            color: #333;
            white-space: pre-line;
        }

        /* Slide animations */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .chat-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .form-container {
                flex-direction: column;
            }
            
            input[type="text"] {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Animated particles background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="header">
            <!-- Iron Lady Official Logo -->
            <img src="{{ url_for('static', filename='iron-lady-logo.png') }}" alt="Iron Lady Logo" class="logo">
            <h1>AI Assistant</h1>
            <p class="subtitle">Empowering Women Leaders • Your Gateway to Success</p>
        </div>

        <div class="chat-container">
            <form id="chatForm" class="form-container">
                <input type="text" id="messageInput" name="message" placeholder="Ask about our leadership programs, community, or how we can help advance your career..." required>
                <button type="submit" id="submitBtn">Ask Assistant</button>
            </form>

            <div id="responseContainer" style="display: none;">
                <div class="response-container">
                    <p><strong>🤖 Assistant:</strong> <span id="responseText"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const responseContainer = document.getElementById('responseContainer');
        const responseText = document.getElementById('responseText');

        // Handle form submission
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent page reload
            
            const message = messageInput.value.trim();
            if (!message) return;

            // Show loading state
            submitBtn.textContent = 'Processing...';
            submitBtn.disabled = true;
            messageInput.disabled = true;
            
            // Show processing message
            responseContainer.style.display = 'block';
            responseText.textContent = 'Processing your question, please wait...';

            try {
                // Send request to chat API endpoint
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `message=${encodeURIComponent(message)}`
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success) {
                        // Display the AI response with bold formatting for **text**
                        let formattedResponse = data.response
                            // Handle **text** patterns with more robust regex
                            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                            // Handle line breaks
                            .replace(/\n/g, '<br>');
                        responseText.innerHTML = formattedResponse;
                    } else {
                        responseText.textContent = data.response || 'Sorry, I encountered an error processing your request.';
                    }
                } else {
                    responseText.textContent = 'Sorry, I encountered an error. Please try again.';
                }
            } catch (error) {
                console.error('Error:', error);
                responseText.textContent = 'Sorry, I encountered a network error. Please try again.';
            } finally {
                // Restore form state but keep the input
                submitBtn.textContent = 'Ask Assistant';
                submitBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
                messageInput.select(); // Select text for easy editing
            }
        });

        // Focus on input when page loads
        window.addEventListener('load', function() {
            messageInput.focus();
        });

        // Handle Enter key in input
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Add some visual feedback for typing
        messageInput.addEventListener('input', function() {
            if (this.value.trim()) {
                submitBtn.style.opacity = '1';
            } else {
                submitBtn.style.opacity = '0.7';
            }
        });
    </script>
</body>
</html>
